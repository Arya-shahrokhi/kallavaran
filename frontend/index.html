<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f1" />
    <title>کالاوران | فروشگاه محصولات گیاهی و طبیعی</title>
    <meta name="description" content="خرید آنلاین گیاهان دارویی، ادویه، عرقیات، دمنوش، خشکبار و روغن‌های گیاهی با کیفیت تضمینی و ارسال سریع." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="کالاوران" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/brand/kalavaran-logo-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/brand/kalavaran-logo-512.png" />
    <meta property="og:description" content="هندسه‌ای از عطر، طعم و طبیعت." />
    <meta property="og:locale" content="fa_IR" />

    <!-- بخشی از تصاویر seed هنوز روی CDN بیرونی است: هزینه DNS/TLS را جلوتر می‌بریم -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      فونت دیگر رندر را بلاک نمی‌کند.

      قبلاً یک <link rel="stylesheet"> ساده با شش وزن (300 تا 800) بود؛ مرورگر
      تا دانلود شدن آن CSS هیچ پیکسلی رنگ نمی‌کرد و روی اتصال ضعیف صفحه چند
      صد میلی‌ثانیه سفید می‌ماند. دو تغییر:
        ۱. فقط وزن‌هایی که واقعاً استفاده می‌شوند (400/500/600/700/800).
        ۲. بارگذاری غیربلاک‌کننده با الگوی media=print + onload؛ متن فوراً با
           فونت سیستمی نمایش داده می‌شود و بعد به وزیرمتن سوییچ می‌کند.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- تصویر hero عنصر LCP صفحه‌ی خانه است: زودتر از کشف شدن در DOM شروع می‌شود -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-1200.webp"
      type="image/webp"
      imagesrcset="/images/hero-800.webp 800w, /images/hero-1200.webp 1200w, /images/hero-1800.webp 1800w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
